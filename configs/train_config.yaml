# CLIPVAE训练配置
experiment_name: "clipvae_human_breast_cancer_v1"
seed: 42
device: "cuda"
num_workers: 4
pin_memory: true

# 数据配置
data:
  adata_path: "data/processed/breast_cancer.h5ad"
  image_path: "data/processed/HE_image.png"
  patch_size: 224
  batch_size: 64
  val_batch_size: 128
  train_ratio: 0.8

# 模型配置
model:
  gene_dim: 2000  # 高变基因数量
  hidden_dim: 512
  latent_dim: 128
  num_gene_layers: 3
  dropout: 0.2
  activation: "gelu"
  freeze_clip: true

# 训练配置
training:
  epochs: 100
  optimizer: "adamw"
  learning_rate: 0.0003
  weight_decay: 0.0001
  betas: [0.9, 0.999]
  scheduler: "cosine"
  warmup_epochs: 10
  min_lr: 1e-6
  gradient_clip_val: 1.0

# 损失函数配置
loss:
  recon_loss_type: "mse"
  kl_weight: 0.001
  contrastive_weight: 0.1

# 日志和保存
logging:
  log_interval: 10
  val_interval: 1
  save_interval: 5
  save_top_k: 3
  monitor: "val_recon_loss"
  mode: "min"
  use_wandb: false
  wandb_project: "clipvae-spatial-transcriptomics"